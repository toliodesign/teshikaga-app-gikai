name: 動画一覧を更新
on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 日本時間の朝6時
  workflow_dispatch:        # 手動でも実行できる
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 読み取りの検査
        run: python scripts/test_parse.py
      - name: YouTubeから動画情報を集める
        run: python scripts/update.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 変更があれば保存する
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || (git commit -m "動画一覧を更新" && git push)
